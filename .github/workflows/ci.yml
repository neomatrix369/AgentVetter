name: CI

# Ultra-minimal PR / merge gates (parity with quine-factory 2026-09-11 cut).
# Ship-path coverage stays on the merge gate (ADR-0013 Must).
# Deferred to lesser-frequency slots:
#   - Semgrep · CodeQL · gitleaks full · Trivy full · dashboard prototype tests
#       → nightly.yml (A daily 02:00 UTC)
#   - Meterian strict · SBOM · Chalk → supply-chain.yml (B Mon 03:00 UTC)
#   - Stryker / mutmut → mutation.yml (C 1st+15th 04:00 UTC)
#   - Code Review Graph → code-review-graph.yml (nightly schedule)
# Mon 03:00 CI T3 re-run removed — weekly B already covers SCA; PR/push cover T1–T3 essentials.
#
# Status badge: README + docs/README.md (CI).
# Primary stack (docs): Cursor · Modal · Supabase · Tripwire
# Scanners (docs): Cisco Skill/MCP · Snyk · Tessl

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  repo-lint:
    name: Repo lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv pip install --system -e ".[dev]"
      - run: pre-commit run shellcheck --all-files
      - run: pre-commit run actionlint --all-files
      - run: pre-commit run markdownlint --all-files

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv pip install --system -e ".[dev]"
      - uses: actions/cache@v6
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
      - run: ruff check sandbox guard scripts
      - run: ruff format --check sandbox guard scripts
      - run: mypy sandbox/ guard/
      - run: bandit -c pyproject.toml -r sandbox guard scripts -q -ll
      - run: bash scripts/complexity-report.sh
      - name: Xenon complexity (scan_app — max C)
        run: >
          xenon --max-absolute C --max-modules B --max-average A
          sandbox/scan_app.py sandbox/__init__.py
      - name: Xenon complexity (scanners.py — bootstrap D; run_snyk tracked for refactor)
        run: >
          xenon --max-absolute D --max-modules C --max-average B
          sandbox/scanners.py
      - run: >
          vulture sandbox/scan_app.py sandbox/scanners.py sandbox/__init__.py guard
          --min-confidence 80
      - run: uv run pylint --disable=all --enable=duplicate-code sandbox/ guard/

  backend-sandbox-tests:
    name: Backend — sandbox tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare test artifacts
        run: |
          mkdir -p .test-results .reports/coverage
          echo "Initialized before dependency installation so early failures retain diagnostics." > .test-results/run-context.txt
          echo "Initialized before dependency installation so early failures retain diagnostics." > .reports/coverage/run-context.txt
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv pip install --system -e ".[dev]"
      - run: |
          pytest sandbox/tests/ -q --tb=short \
            --cov=sandbox \
            --cov-report=term-missing \
            --cov-report=html:.reports/coverage/html \
            --cov-report=xml:.reports/coverage/coverage.xml \
            --cov-report=json:.reports/coverage/coverage.json \
            --cov-fail-under=95 \
            --junitxml=.test-results/junit.xml \
            -o addopts=
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-backend-sandbox-${{ github.run_number }}
          path: .test-results/
          retention-days: 14
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-backend-sandbox-${{ github.run_number }}
          path: .reports/coverage/
          retention-days: 14
      - run: pip-audit --skip-editable

  frontend-cli-tests:
    name: Frontend — CLI tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare test artifacts
        working-directory: cli
        run: |
          mkdir -p .test-results .reports/coverage
          echo "Initialized before dependency installation so early failures retain diagnostics." > .test-results/run-context.txt
          echo "Initialized before dependency installation so early failures retain diagnostics." > .reports/coverage/run-context.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
        working-directory: cli
      - run: npm run lint
        working-directory: cli
      - name: Run tests with coverage
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee .test-results/tap.txt
        working-directory: cli
      - run: npm audit --audit-level=high
        working-directory: cli
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-frontend-cli-${{ github.run_number }}
          path: cli/.test-results/
          retention-days: 14
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-frontend-cli-${{ github.run_number }}
          path: cli/.reports/coverage/
          retention-days: 14

  secrets:
    name: Secrets scan (gitleaks — incremental)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Incremental / PR-scoped via gitleaks-action; full history on nightly
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  sast:
    name: SAST — OSV-Scanner (SCA — known CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Known-CVE gate on PR. Semgrep (patterns) + CodeQL (deep) → nightly.
      - name: OSV-Scanner (SCA)
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          # Exclude intentional vuln fixtures / prototypes (parity with Trivy skip-dirs).
          # Fixture-local osv-scanner.toml also ignores vuln-dependency-lodash.
          scan-args: |-
            --recursive
            --experimental-exclude=fixtures
            --experimental-exclude=prototypes
            --experimental-exclude=internal-docs
            .

  trivy:
    name: Trivy (filesystem — targeted)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Targeted scan on PR/merge; full FS scan on nightly
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          exit-code: "1"
          severity: HIGH,CRITICAL
          format: table
          skip-dirs: fixtures,prototypes,internal-docs,cli/node_modules
          skip-files: .env,.env.local

  trufflehog:
    name: TruffleHog (incremental)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.97.9
        with:
          extra_args: --only-verified --exclude-paths=.trufflehog-exclude
