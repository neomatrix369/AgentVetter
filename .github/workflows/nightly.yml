name: Nightly

# =============================================================================
# A — Nightly / Comprehensive T4 (daily 02:00 UTC)
# =============================================================================
# Cadence:   daily 02:00 UTC  |  cron: "0 2 * * *"  |  + workflow_dispatch
# Deferred from PR CI (ultra-minimal cut 2026-09-11, parity with quine-factory):
#   - Semgrep SAST (patterns / OWASP)
#   - CodeQL deep SAST
#   - Gitleaks full history
#   - Trivy full filesystem
#   - Prototype dashboard tests
# Still includes Light T4: cov snapshots · complexity · TruffleHog full · dep audit
#
# Sibling T4 cadences (do not fold into this workflow):
#   B — supply-chain.yml  weekly Mon 03:00 UTC  |  SBOM · Meterian strict · Chalk
#   C — mutation.yml      1st+15th 04:00 UTC    |  Stryker · advisory mutmut
#   D — code-review-graph.yml — same 02:00 UTC cron — graph review (comment dormant)
# Canonical docs: CONTRIBUTING.md § quality gates · docs/README.md § CI workflows
#                 · ADR-0013
#
# Status badge: README + docs/README.md (Nightly).
# Primary stack (docs): Cursor · Modal · Supabase · Tripwire

on:
  schedule:
    - cron: "0 2 * * *" # A: daily 02:00 UTC — comprehensive T4
  workflow_dispatch:

jobs:
  nightly-tests-python:
    name: Backend — sandbox tests + coverage (nightly snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare test artifact directories
        run: |
          mkdir -p .test-results .reports/coverage
          echo "This directory is initialized before dependency installation so upload diagnostics survive early job failures." > .test-results/run-context.txt
          echo "This directory is initialized before dependency installation so upload diagnostics survive early job failures." > .reports/coverage/run-context.txt
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv pip install --system -e ".[dev]"
      - run: |
          pytest sandbox/tests/ -q --tb=short \
            --cov=sandbox \
            --cov-report=term-missing \
            --cov-report=html:.reports/coverage/html \
            --cov-report=xml:.reports/coverage/coverage.xml \
            --cov-report=json:.reports/coverage/coverage.json \
            --cov-fail-under=95 \
            --junitxml=.test-results/junit.xml \
            -o addopts=
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-test-results-backend-sandbox-${{ github.run_number }}
          path: .test-results/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-coverage-backend-sandbox-${{ github.run_number }}
          path: .reports/coverage/
          retention-days: 30
          if-no-files-found: warn

  nightly-tests-node:
    name: Frontend — CLI tests + coverage (nightly snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare test artifact directories
        working-directory: cli
        run: |
          mkdir -p .test-results .reports/coverage
          echo "This directory is initialized before dependency installation so upload diagnostics survive early job failures." > .test-results/run-context.txt
          echo "This directory is initialized before dependency installation so upload diagnostics survive early job failures." > .reports/coverage/run-context.txt
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
        working-directory: cli
      - name: Run CLI tests with coverage
        working-directory: cli
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee .test-results/tap.txt
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-test-results-frontend-cli-${{ github.run_number }}
          path: cli/.test-results/
          retention-days: 30
          if-no-files-found: warn
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-coverage-frontend-cli-${{ github.run_number }}
          path: cli/.reports/coverage/
          retention-days: 30
          if-no-files-found: warn

  nightly-dashboard-tests:
    name: Prototype dashboard tests (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: prototypes/dc-dashboard/package-lock.json
      - run: npm ci
        working-directory: prototypes/dc-dashboard
      - run: npm run lint
        working-directory: prototypes/dc-dashboard
      - run: npm test
        working-directory: prototypes/dc-dashboard

  nightly-sast-semgrep:
    name: SAST — Semgrep (patterns + OWASP Top 10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Deferred from ci.yml (ultra-minimal 2026-09-11)
      - name: Semgrep SAST
        run: |
          docker run --rm \
            -v "${PWD}:/src" \
            -w /src \
            semgrep/semgrep:1.110.0 \
            semgrep scan \
              --config=p/owasp-top-ten \
              --config=p/python \
              --config=p/javascript \
              --config=p/secrets \
              --error \
              --metrics=off \
              --exclude=node_modules \
              --exclude=fixtures \
              --exclude=prototypes \
              --exclude=internal-docs \
              --exclude=.reports \
              --exclude=.github \
              sandbox guard cli scripts

  nightly-sast-codeql:
    name: CodeQL (deep SAST — full-branch coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  nightly-secrets-gitleaks-full:
    name: Secrets scan (gitleaks — full history)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  nightly-trivy-full:
    name: Trivy (filesystem — full scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Trivy filesystem scan (full)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          exit-code: "1"
          severity: HIGH,CRITICAL
          format: table
          # Intentional vulnerable samples live under fixtures/; same skip set as supply-chain.yml.
          skip-dirs: fixtures,prototypes,internal-docs,cli/node_modules
          skip-files: .env,.env.local

  nightly-complexity:
    name: Complexity report (nightly snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: uv sync --extra dev
      - run: npm ci
        working-directory: cli
      - run: bash scripts/complexity-report.sh
      - name: Upload complexity report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-complexity-${{ github.run_number }}
          path: .reports/complexity/
          retention-days: 30
          if-no-files-found: warn

  trufflehog-full:
    name: TruffleHog (full git history)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.97.9
        with:
          path: ./
          base: ""
          extra_args: --only-verified --exclude-paths=.trufflehog-exclude

  dependency-audit:
    name: Dependency audit (full lockfile sweep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv pip install --system -e ".[dev]"
      - run: pip-audit --skip-editable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
        working-directory: cli
      - run: npm audit --audit-level=high
        working-directory: cli
